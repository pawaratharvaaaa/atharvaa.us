<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 267 203" width="267" height="203" class="atharva-animated-signature">
  <style>
    .sig-stroke {
      stroke: #ff5a3d;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawSig 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .sig-fill {
      fill: #ff5a3d;
      opacity: 0;
      animation: fadeSig 0.6s ease-out 1.8s forwards;
    }
    @keyframes drawSig {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes fadeSig {
      to {
        opacity: 1;
      }
    }
  </style>

